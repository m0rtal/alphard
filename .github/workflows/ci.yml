name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alphard
          POSTGRES_PASSWORD: test_pg_password_for_ci_only
          POSTGRES_DB: alphard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHARD_PG_DSN: host=localhost port=5432 dbname=alphard user=alphard password=test_pg_password_for_ci_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Editable install: exposes `src.*` to tests (PYTHONPATH=$PWD would
          # also work, but `pip install -e .` is the standard convention and
          # makes the package importable from any CWD in subsequent steps).
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-fail-under=95 --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          # Pinned deps first (black==24.10.0 etc.) to ensure local == CI formatting.
          # If we install unconstrained pip may grab a newer black whose formatter
          # diffs from the local install → CI fails on byte-different output.
          pip install -r requirements.txt
          pip install -e .
          pip install flake8 mypy

      - name: Black formatting check
        run: black --check src/ tests/

      - name: Flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Mypy
        run: mypy src/ --strict --ignore-missing-imports

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alphard
          POSTGRES_PASSWORD: ci_test_password_DO_NOT_USE_IN_PRODUCTION
          POSTGRES_DB: alphard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHARD_PG_DSN: host=localhost port=5432 dbname=alphard user=alphard password=ci_test_password_DO_NOT_USE_IN_PRODUCTION
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install t-tech-investments --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
          pip install -r requirements.txt
          pip install types-requests
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests with coverage (incl. Postgres integration)
        run: |
          # Tests use ``Path(__file__).resolve().parent.parent`` to locate
          # compose/init scripts, so they don't depend on the runner user
          # being able to traverse /root — works in any checkout layout.
          pytest --cov=src --cov-fail-under=95 --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install t-tech-investments --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
          pip install -r requirements.txt
          pip install types-requests
          pip install -e .
          pip install flake8 mypy

      - name: Black formatting check
        run: |
          pip install --quiet 'black>=26.3.1,<27.0'
          black --check src/ tests/

      - name: Flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Mypy
        run: mypy src/ --strict --ignore-missing-imports

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # Issue #55: catch any future commit that hardcodes the Grafana admin
  # password or re-enables anonymous auth. The deploy script (and only the
  # deploy script, per issue #55) is allowed to read GF_SECURITY_ADMIN_PASSWORD
  # from a runtime env var via ${GRAFANA_ADMIN_PASSWORD} — gitleaks doesn't
  # understand bash interpolation, so this ripgrep-based guard complements
  # it with project-specific semantics.
  grafana-secrets:
    name: Grafana secrets guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan for hardcoded Grafana admin password or anonymous flag
        run: |
          set -euo pipefail
          BAD=0
          # Match assignments like GF_SECURITY_ADMIN_PASSWORD=alphard or
          # GF_SECURITY_ADMIN_PASSWORD: alphard (YAML compose form is OK
          # because it uses ${GRAFANA_ADMIN_PASSWORD:?...required} — we
          # look for a literal RHS only).
          if grep -RnE 'GF_SECURITY_ADMIN_PASSWORD[[:space:]]*[:=][[:space:]]*[A-Za-z0-9]' \
              scripts/ docker-compose.yaml docker/; then
            echo "::error::Hardcoded GF_SECURITY_ADMIN_PASSWORD detected — must source from env."
            BAD=1
          fi
          if grep -RnE 'GF_AUTH_ANONYMOUS_ENABLED[[:space:]]*[:=][[:space:]]*true' \
              scripts/ docker-compose.yaml docker/; then
            echo "::error::GF_AUTH_ANONYMOUS_ENABLED=true detected — LAN info-disclosure (issue #55)."
            BAD=1
          fi
          exit "${BAD}"


  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit (strict)
        # Issue #16: SCA in CI catches CVE before merge.
        # pip-audit 2.x dropped --skip-prefix; we exclude
        # t-tech-investments via a filtered requirements file
        # (requirements-ci.txt) since Tinkoff SDK has no public
        # CVE feed.
        run: |
          pip-audit --strict --requirement requirements-ci.txt

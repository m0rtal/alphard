name: ci

"on":
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov
      - run: pytest --cov=src --cov-fail-under=80

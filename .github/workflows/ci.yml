name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alphard
          POSTGRES_PASSWORD: ci_test_password_DO_NOT_USE_IN_PRODUCTION
          POSTGRES_DB: alphard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHARD_PG_DSN: host=localhost port=5432 dbname=alphard user=alphard password=ci_test_password_DO_NOT_USE_IN_PRODUCTION
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install t-tech-investments --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
          pip install -r requirements.txt
          pip install types-requests
          pip install -e .
          pip install pytest pytest-cov

      - name: Make files readable for the runner user
        run: |
          # Debug: print what we see
          echo "--- ls -la top-level ---"
          ls -la /root/projects/alphard 2>&1 | head -3 || true
          echo "--- whoami ---"
          whoami
          echo "--- stat docker-compose.yaml ---"
          stat /root/projects/alphard/docker-compose.yaml 2>&1 || true
          echo "--- reading docker-compose.yaml with cat ---"
          cat /root/projects/alphard/docker-compose.yaml 2>&1 | head -3 || echo "cat failed"
          echo "--- reading docker-compose.yaml with python ---"
          /opt/hostedtoolcache/Python/3.11.15/x64/bin/python3 -c "print(open('/root/projects/alphard/docker-compose.yaml').read()[:100])" 2>&1 || echo "python failed"
      - name: Run tests with coverage (incl. Postgres integration)
        run: |
          pytest --cov=src --cov-fail-under=95 --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install t-tech-investments --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
          pip install -r requirements.txt
          pip install types-requests
          pip install -e .
          pip install flake8 mypy

      - name: Black formatting check
        run: |
          pip install --quiet 'black==24.10.0'
          black --check src/ tests/

      - name: Flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Mypy
        run: mypy src/ --strict --ignore-missing-imports

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


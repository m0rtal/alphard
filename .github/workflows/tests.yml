name: tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alphard
          POSTGRES_PASSWORD: test_pg_password_for_ci_only
          POSTGRES_DB: alphard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHARD_PG_DSN: host=localhost port=5432 dbname=alphard user=alphard password=test_pg_password_for_ci_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest --cov=src --cov-fail-under=80 --cov-report=term-missing

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install flake8 mypy black

      - name: Black
        run: black --check src/ tests/

      - name: Flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Mypy
        run: mypy src/ --ignore-missing-imports

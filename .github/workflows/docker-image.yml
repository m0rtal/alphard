name: Build + Push Docker image

# GHCR pipeline for Alphard.
#
# Pipeline:
#   1. CI workflow runs tests + lint (separate: ci.yml)
#   2. This workflow builds Docker image on every push to main + tags
#   3. Pushes to ghcr.io/m0rtal/alphard:latest (and :sha when tagged)
#
# Phase 1.3 deploy target:
#   - Portainer on .107 uses `image: ghcr.io/m0rtal/alphard:latest`
#   - Watchtower (or manual pre-pull) updates container in-place
#   - This solves the .107 → GitHub clone timeout (no build context needed)
#
# Phase 0 stop-gap:
#   - Stack #97 already uses pre-built `alphard:latest` on .107 (built locally Phase 0)
#   - Once this workflow fires, the image will be replaced with GHCR build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # m0rtal/alphard

jobs:
  build:
    name: Build + push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Docker tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # Build args if needed (none for now — requirements.txt is enough)

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker load --input "${{ steps.build-push-action.outputs.dockerfile }}" 2>/dev/null || \
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} || \
            echo "PR smoke test skipped (image not available locally)"
          # Quick smoke test: python -c "import sys; sys.exit(0)" inside the container
          # ensures the image is at least importable.

  trigger-portainer-pull:
    name: Notify Portainer to pull
    # Optional: webhook to Portainer after image pushed.
    # Requires PORTAINER_WEBHOOK_URL secret in repo settings.
    # Phase 1.3+: replace with actual webhook + Watchtower auto-pull.
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy webhook
        if: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"stack":"alphard","image":"ghcr.io/m0rtal/alphard:latest"}' \
            || echo "Webhook failed (likely not configured yet)"
        continue-on-error: true
      - name: Manual instructions (when webhook not configured)
        if: ${{ secrets.PORTAINER_WEBHOOK_URL == '' }}
        run: |
          echo "::notice::Image pushed to GHCR. To deploy on .107:"
          echo "  ssh root@192.168.1.107 'docker pull ghcr.io/m0rtal/alphard:latest'"
          echo "  Portainer UI → stack #97 → Editor → redeploy"
          echo "Or set PORTAINER_WEBHOOK_URL secret for automation."

name: Build + Push Docker image

# GHCR pipeline for Alphard.
#
# Pipeline:
#   1. CI workflow runs tests + lint (separate: ci.yml)
#   2. This workflow builds Docker image on every push to main + tags
#   3. Pushes to ghcr.io/m0rtal/alphard:latest (and :sha when tagged)
#
# Phase 1.3 deploy target:
#   - Portainer on .107 uses image ghcr.io/m0rtal/alphard:latest
#   - Watchtower (or manual pre-pull) updates container in-place
#   - This solves the .107 → GitHub clone timeout (no build context needed)
#
# Phase 0 stop-gap:
#   - Stack #97 already uses pre-built alphard:latest on .107 (built locally Phase 0)
#   - Once this workflow fires, the image will be replaced with GHCR build

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Docker tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "PR smoke test - image was built but not pushed."
          echo "Re-run on main to verify push works end-to-end."

[tool.poetry]
name = "alphard"
version = "0.1.0"
description = "Alphard: autonomous trading bot on MOEX"
authors = ["m0rtal <m0rtal@example.com>"]
license = "Apache-2.0"
readme = "README.md"
python = "^3.11"
# src-layout: package code lives under src/, declared explicitly so that
# `pip install -e .` works (poetry-core otherwise looks for a top-level
# `alphard/` directory which does not exist).
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
# Phase 1+: добавляем по мере надобности
# tinkoff-investments = "^2.0"
# riskfolio-lib = "^0.1"
# lightgbm = "^4.0"
# vectorbt = "^0.1"
# pandas = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^4.0"
black = "^26.3.1"
flake8 = "^7.0"
mypy = "^1.10"
gitleaks = "^8.18"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["scripts"]
addopts = "-ra --strict-markers --strict-config --cov=src --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "src/main.py",  # Phase 0 stub, not production code
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
# Phase 1.1 mypy config: relaxed for scaffold code. Tighten to --strict in Phase 1.5.
# Why relaxed:
#   1. psycopg type stubs not available locally → --ignore-missing-imports in CI
#   2. tinkoff SDK uses Any heavily → cannot fix without SDK changes
#   3. pydantic ConfigDict / Field generics → many false positives on --strict
# What we DO enforce: no Any returns (no-any-return), correct union-attr handling.
files = ["src"]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = false  # false positives on # type: ignore when deps missing

[tool.black]
# Kept in sync with flake8 max-line-length in .github/workflows/ci.yml.
line-length = 120
target-version = ["py311"]

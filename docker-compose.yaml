version: "3.9"

# Alphard stack — локальный development/production deployment.
# Перед любым изменением image/env/volume — сверяйся с portainer-stack.yaml.
# Эти два файла синхронизированы в рамках D-H3 (см. AUDIT-Phase0-FINAL).

services:
  alphard-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: alphard:latest
    container_name: alphard-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - alphard-net
    # Phase 0: healthcheck отключён (entrypoint — stub, не поднимает HTTP)
    # TODO Phase 1: реальный health endpoint через FastAPI
    # SECURITY: running as root. Phase 1+ MUST add:
    #   user: "1000:1000"
    # to reduce attack surface (SECURITY.md P0 #3).
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  postgres:
    image: postgres:16-alpine
    container_name: alphard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind-mount './docker/postgres/init.sql' omitted in Phase 0 — path doesn't exist;
    # Phase 1+ may add via compose extension.
    # ports: NO — postgres ТОЛЬКО внутри alphard-net (SECURITY.md P0 #8)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphard-net

  redis:
    image: redis:7-alpine
    container_name: alphard-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    # Healthcheck uses ping without password to avoid leaking REDIS_PASSWORD
    # into /proc/1/cmdline (PIDC1 read by host processes leaks credential).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphard-net

  # Observability — Phase 0+ (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: alphard-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - alphard-net
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    container_name: alphard-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - alphard-net
    profiles: ["observability"]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  alphard-net:
    driver: bridge

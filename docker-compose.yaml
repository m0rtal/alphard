version: "3.9"

# =============================================================================
# Alphard Phase 1 — docker-compose.yaml
# =============================================================================
#
# Migration 2026-08-15: bind mounts at /mnt/appdata/alphard/{postgres,redis,logs}
# replace named Docker volumes. Bind mounts:
#   - Survive `docker stack rm` and stack redeploy
#   - Show up directly on host filesystem for backups (rsync, restic)
#   - Allow live inspection of OHLCV data and logs
#   - Match convention used by 14+ other stacks on .107 (honcho, forgejo,
#     immich, paperclip, bitmagnet, minecraft, etc.)
#
# Obsolete named volumes to clean up manually if they exist:
#   docker volume rm alphard_alphard-postgres-data
#   docker volume rm alphard_alphard-redis-data
#   docker volume rm alphard_alphard-logs
#   docker volume rm alphard-logs (legacy)
#
# Phase 1 components:
#   - alphard-bot   : heartbeat + cron-launched daily_sync.py
#   - postgres      : DataStore (ohlcv_daily, ticker_universe, decision_log)
#   - redis         : cache for risk state, news, portfolio drift
#
# Phase 3+ additions (profiles: ["observability"]):
#   - prometheus    : scrape /metrics
#   - grafana       : dashboards
# =============================================================================
services:
  alphard-bot:
    image: ghcr.io/m0rtal/alphard:latest
    container_name: alphard-bot
    restart: unless-stopped
    env_file:
      - .env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      ENV: ${ENV:-production}
      TINKOFF_SANDBOX_TOKEN: ${TINKOFF_SANDBOX_TOKEN:?TINKOFF_SANDBOX_TOKEN required}
      TINKOFF_REAL_TOKEN: ${TINKOFF_REAL_TOKEN:-}
      TINKOFF_ACCOUNT_ID: ${TINKOFF_ACCOUNT_ID:-}
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      RISK_MAX_DD_PCT: ${RISK_MAX_DD_PCT:-10}
      RISK_MAX_POSITION_PCT: ${RISK_MAX_POSITION_PCT:-5}
      RISK_MAX_SECTOR_PCT: ${RISK_MAX_SECTOR_PCT:-30}
      RISK_MAX_DAILY_LOSS_PCT: ${RISK_MAX_DAILY_LOSS_PCT:-3}
      RISK_ALLOW_SHORT: ${RISK_ALLOW_SHORT:-false}
      RISK_LEVERAGE_MAX: ${RISK_LEVERAGE_MAX:-1.0}
      DATA_DEFAULT_TIMEFRAME: ${DATA_DEFAULT_TIMEFRAME:-1d}
      DATA_HISTORY_YEARS: ${DATA_HISTORY_YEARS:-5}
      LIVE_TRADING: ${LIVE_TRADING:-false}
      # Phase 2.8 step 1: Prometheus metrics HTTP server port.
      # Defaults to 8765; exposed at alphard-bot:8765/metrics inside the network.
      ALPHARD_METRICS_PORT: ${ALPHARD_METRICS_PORT:-8765}
    volumes:
      - /mnt/appdata/alphard/logs:/app/logs
    networks:
      - alphard-net
    # BUGFIX (H-7): wait for postgres to be healthy before starting the bot,
    # otherwise the first store.count_ohlcv() crashes with connection refused.
    depends_on:
      postgres:
        condition: service_healthy
      pg-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  postgres:
    image: postgres:16-alpine
    container_name: alphard-postgres
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      # BUGFIX (H-8): fail-fast on missing password instead of starting
      # Postgres with an empty root password (which then allows empty auth).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
    volumes:
      - /mnt/appdata/alphard/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # BUGFIX (H-9): bind-mount the real-auth healthcheck script.
      # The default pg_isready check returns healthy even when pg_authid
      # holds stale scram hashes from a previous deploy (production bug
      # 2026-08-18). psql -U $USER -c 'SELECT 1' does a full auth
      # round-trip under our credentials so a real credential mismatch
      # surfaces as container=unhealthy → depends_on blocks the bot.
      - ./docker/postgres/healthcheck.sh:/usr/local/bin/alphard-pg-healthcheck.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/alphard-pg-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphard-net

  redis:
    image: redis:7-alpine
    container_name: alphard-redis
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # BUGFIX (H-8): fail-fast on missing redis password.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - /mnt/appdata/alphard/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphard-net

  # BUGFIX (Phase 1.6 audit): init_postgres.sh runs as a one-shot
  # service after postgres becomes healthy. It applies the
  # 192.168.0.0/16 trust line to pg_hba.conf so any client from the
  # internal subnet can authenticate without a password match.
  # Idempotent (skips if the line already exists).
  pg-init:
    image: alpine:3.20
    container_name: alphard-pg-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache postgresql-client bash >/dev/null
        # Wait for postgres to accept connections.
        until PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres \
              -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c 'SELECT 1' >/dev/null 2>&1; do
          echo "[pg-init] waiting for postgres..."
          sleep 3
        done
        HBA=$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
               -d "$$POSTGRES_DB" -tAc "SHOW hba_file")
        # Run the same logic as scripts/init_postgres.sh, but in-container
        # (since hba_file is on the postgres container's filesystem).
        if grep -q '192.168.0.0/16 trust' "$$HBA" 2>/dev/null; then
          echo "[pg-init] trust line already present, skipping"
        else
          # Strip legacy 0.0.0.0/0 if present.
          sed -i '/^host all all 0\.0\.0\.0\/0 trust$/d' "$$HBA" 2>/dev/null || true
          sed -i '1i host all all 192.168.0.0/16 trust' "$$HBA"
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
            -d "$$POSTGRES_DB" -c 'SELECT pg_reload_conf()' >/dev/null
          echo "[pg-init] injected 192.168.0.0/16 trust + pg_reload_conf()"
        fi
        echo "[pg-init] OK"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
    networks:
      - alphard-net
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: alphard-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/appdata/alphard/prometheus:/prometheus
    ports:
      - "9090:9090"
    networks:
      - alphard-net
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    container_name: alphard-grafana
    restart: unless-stopped
    # BUGFIX (2026-08-20): .107 Docker daemon has broken bridge port mapping
    # (iptables NAT empty after ContainerStart). Standard HostPort publishing
    # silently fails — host->container port is unreachable. Workaround: use
    # network_mode: host. Grafana shares the host network namespace, so its
    # 0.0.0.0:3000 listener = host's 0.0.0.0:3000. forgejo already lives on
    # host:3000, so Grafana binds to 3300 via GF_SERVER_HTTP_PORT instead.
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_SERVER_HTTP_PORT: "3300"
    user: "472:472"
    volumes:
      - /mnt/appdata/alphard/grafana:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles: ["observability"]

networks:
  alphard-net:
    driver: bridge

version: "3.9"

# =============================================================================
# Alphard Phase 1 — docker-compose.yaml
# =============================================================================
#
# Stack-level host paths are parameterised via APPDATA_DIR (default
# /srv/alphard; on .107 this is conventionally overridden to
# /mnt/appdata/alphard to match the rest of the selfhosted fleet: honcho,
# forgejo, immich, paperclip, bitmagnet, minecraft, etc.). Each
# service that touches a host path is fronted by a one-shot <svc>-init
# service that mkdir -p's the leaf with the correct UID/GID before the
# real service starts (grafana-init for grafana, pg-init for postgres).
# This makes first-shot install portable: an operator cloning this repo
# and running `docker compose --profile observability up` on a fresh LXC
# gets a working stack without any per-host path edits.
#
# Why not bind-mount directly into named volumes for /app/logs and
# /prometheus (PR #119, #147)? Same root cause as the /mnt/appdata
# userns-mapping bug (Docker 29.1.x + PVE LXC maps bind-mount leaf to
# nobody:nogroup, which neither the in-container user nor CAP_CHOWN can
# fix). tmpfs is the cheapest portable workaround — data is volatile
# across container restarts, acceptable for logs (RotatingFileHandler
# caps log retention) and the Prometheus TSDB (rebuild from bot on
# restart). Restore named-volume paths once we move to a non-LXC host.
#
# Phase 1 components:
#   - alphard-bot        : heartbeat + cron-launched daily_sync.py
#   - postgres           : DataStore (ohlcv_daily, ticker_universe, decision_log)
#   - redis              : cache for risk state, news, portfolio drift
#   - pg-init            : injects Docker-bridge trust line into pg_hba.conf
#   - grafana-init       : creates APPDATA_DIR/grafana with UID 472 ownership
#
# Phase 3+ additions (profiles: ["observability"]):
#   - prometheus : scrape /metrics
#   - grafana    : dashboards
# =============================================================================
services:
  alphard-bot:
    image: ghcr.io/m0rtal/alphard:latest
    container_name: alphard-bot
    restart: unless-stopped
    # BUGFIX (#122): bot must run as root to read bind-mounted /root/.env
    user: root
    # BUGFIX (2026-08-21 LXC): docker-default AppArmor profile cannot load
    # in LXC unprivileged sandbox — bypass via unconfined for the whole
    # stack. Local-only override; .107 production is plain Docker and
    # tolerates extra cap (security_opt is per-container, not global).
    security_opt:
      - apparmor=unconfined
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # BUGFIX (#84): pass explicit ENV_FILE path so entrypoint.sh sources
      # the host's /root/.env even when the bind-mounted candidates
      # (/run/secrets/alphard.env, /run/secrets/alphard_env) resolve to
      # empty directories on .107 Docker 29.1.x. 11 chars — well under the
      # 60-char Portainer Env-parameter limit, so the long Tinkoff tokens
      # (64+ chars) still have to come from the file body.
      ENV_FILE: ${ENV_FILE:-/root/.env}
      ENV: ${ENV:-production}
      TINKOFF_SANDBOX_TOKEN: ${TINKOFF_SANDBOX_TOKEN:-}
      TINKOFF_REAL_TOKEN: ${TINKOFF_REAL_TOKEN:-}
      TINKOFF_ACCOUNT_ID: ${TINKOFF_ACCOUNT_ID:-}
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      RISK_MAX_DD_PCT: ${RISK_MAX_DD_PCT:-10}
      RISK_MAX_POSITION_PCT: ${RISK_MAX_POSITION_PCT:-5}
      RISK_MAX_SECTOR_PCT: ${RISK_MAX_SECTOR_PCT:-30}
      RISK_MAX_DAILY_LOSS_PCT: ${RISK_MAX_DAILY_LOSS_PCT:-3}
      RISK_ALLOW_SHORT: ${RISK_ALLOW_SHORT:-false}
      RISK_LEVERAGE_MAX: ${RISK_LEVERAGE_MAX:-1.0}
      DATA_DEFAULT_TIMEFRAME: ${DATA_DEFAULT_TIMEFRAME:-1d}
      DATA_HISTORY_YEARS: ${DATA_HISTORY_YEARS:-5}
      LIVE_TRADING: ${LIVE_TRADING:-false}
      # Phase 2.8 step 1: Prometheus metrics HTTP server port.
      # Defaults to 8765; exposed at alphard-bot:8765/metrics inside the network.
      ALPHARD_METRICS_PORT: ${ALPHARD_METRICS_PORT:-8765}
    volumes:
      # BUGFIX (alphard#108): bind-mount on .107 PVE LXC leaves the
      # leaf owned by userns-mapped nobody (uid 65534), which neither
      # the container's root user nor CAP_CHOWN can change. Alphard-bot
      # entrypoint.sh therefore cannot write /app/logs/backfill_*.log
      # and the whole stack restart-loops. Workaround: use a tmpfs
      # mount for /app/logs (root-owned, always writable). Cost: log
      # files live only inside the container, not on host filesystem,
      # so they are lost on container restart. Acceptable for Phase 0
      # — restore bind-mount once we move logs to a non-LXC Docker host
      # (e.g. .110, no userns mapping) or fix the bind-mount leaf
      # ownership via a different mechanism.
      #
      # Issue #120 (Defects 1, 2, 4) mitigates the tmpfs trade-off
      # (RotatingFileHandler in backfill_history_md.py, stderr banner
      # in entrypoint.sh, regression tests in test_compose_structure.py).
      # Defect 3 follow-up is tracked in issue #123.
      - type: tmpfs
        target: /app/logs
        tmpfs:
          size: 100M
      # BUGFIX (#122): bind-mount host /root/.env so entrypoint.sh can source ALPHARD_PG_DSN
      - /root/.env:/root/.env:ro
    networks:
      - alphard-net
    # BUGFIX (H-7): wait for postgres to be healthy before starting the bot,
    # otherwise the first store.count_ohlcv() crashes with connection refused.
    depends_on:
      - postgres
      - pg-init
    healthcheck:
      # Phase 2.8 metrics server (PR #52, #144) exposes GET /health on
      # ALPHARD_METRICS_PORT (default 8765) returning 200 with body "ok".
      # We hit 127.0.0.1:8765/health — the listener binds 0.0.0.0 inside
      # the container, so the loopback works without depending on the
      # alphard-net bridge. start_period=60s covers the slow first-boot
      # path: Postgres pg_hba.conf patch + main.py imports + MetricsServer
      # bind (typically 8–15s on this stack). retries=3 / interval=30s
      # gives a 90s grace window before the container is marked
      # unhealthy, which matches the existing postgres healthcheck
      # policy. Python3 is in the runtime image (src/main.py depends on
      # it), so no new deps.
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; r=urllib.request.urlopen(\"http://127.0.0.1:8765/health\", timeout=2); assert r.status==200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: alphard-postgres
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      # BUGFIX (H-8): fail-fast on missing password instead of starting
      # Postgres with an empty root password (which then allows empty auth).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
    volumes:
      - alphard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # BUGFIX (#126): inline shell healthcheck to avoid the .107
      # PVE LXC bind-mount leaf-directory quirk (Docker 29.1.x creates
      # ./docker/postgres/healthcheck.sh as a directory, not a file →
      # /bin/sh: Permission denied exit 126 → container permanently
      # unhealthy even though the script is correct).
      #
      # Two-stage probe:
      #   1. pg_isready with credentials — TCP+auth liveness
      #   2. psql SELECT 1 with PGPASSWORD — full auth round-trip,
      #      catches stale pg_authid scram hashes (prod bug 2026-08-18
      #      where pg_isready returned healthy but every real auth
      #      attempt failed)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h localhost -tAc 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - alphard-net

  redis:
    image: redis:7-alpine
    container_name: alphard-redis
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # BUGFIX (2026-08-22 #149): Portainer standalone does NOT propagate
    # stack-level Env vars into service-level environment unless the
    # service explicitly declares them. Without this explicit declaration
    # the redis container's entrypoint sees REDIS_PASSWORD as unset,
    # the inline fail-fast gate trips, and the container restart-loops
    # forever (verified on .107 stack #111 after StackUpdate from main
    # HEAD 95c7095 — alphard-redis exited every 1s with "REDIS_PASSWORD
    # is required (unset/empty in env)").
    #
    # The same applies to POSTGRES_PASSWORD on postgres and every other
    # service that consumes stack-level secrets. Listing them here does
    # NOT change compose CLI behaviour — `${VAR:-}` defaults still apply
    # if the operator omits the Env from Portainer stack config — it
    # just stops Portainer from stripping them from the rendered
    # container env. Keep this list in sync with the stack Env config
    # (see /data/compose/111/stack.env on .107 for the canonical list).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # BUGFIX (H-8): fail-fast on missing redis password.
    #
    # Why not `${REDIS_PASSWORD:?...}`: YAML anchor (Portainer StackUpdate
    # `?` semantics) makes the literal form `?` blow up Compose parsing
    # under Portainer standalone (issue #122 regression). We instead
    # wrap the redis command in an inline shell script that exits
    # non-zero if REDIS_PASSWORD is unset/empty. `$$` is escaped so
    # Compose renders it as a literal `$` for the container shell.
    # With REDIS_PASSWORD="" the container exits within ~1s of
    # `docker compose up` → restart loop visible in `docker ps`.
    command:
      - sh
      - -c
      - |
        # Issue #129: harden the fail-fast gate against shell-metacharacter
        # passwords. PR #128 only checked for empty REDIS_PASSWORD, but the
        # command runs under `sh -c`, so a non-empty password containing
        # `$`, `"`, `\`, or backtick would be silently mangled before
        # `redis-server --requirepass` saw it. In the worst case the
        # mangling produces an empty `--requirepass` arg and Redis starts
        # without authentication (any container on the alphard-net bridge
        # can then read/write Redis). In the more common case Redis fails
        # to start with "wrong number of arguments" and the container
        # restart-loops until the operator notices.
        if [ -z "$${REDIS_PASSWORD:-}" ]; then
          echo "[alphard-redis] FATAL: REDIS_PASSWORD is required (unset/empty in env)" >&2
          echo "[alphard-redis] FATAL: set REDIS_PASSWORD in .env before 'docker compose up'" >&2
          exit 1
        fi
        # Reject any shell metacharacter in the password. We use printf
        # to inject literal `$` and `"` into the case pattern because
        # POSIX case-pattern matching has no portable way to escape them
        # inside a literal-string pattern; backslash and backtick can be
        # written as literal `'\'` and `` '`' ``. The heredoc preserves
        # the backslashes verbatim. See issue #129.
        case "$${REDIS_PASSWORD}" in
          *$(printf '%s' '$')*|*$(printf '%s' '"')*|*'\'*|*'`'*)
            echo "[alphard-redis] FATAL: REDIS_PASSWORD contains shell-unsafe characters (\$, \", \\, or backtick)" >&2
            echo "[alphard-redis] FATAL: regenerate with: openssl rand -base64 24" >&2
            echo "[alphard-redis] FATAL: the inline sh -c wrapper would mangle --requirepass before redis-server could read it" >&2
            exit 1
            ;;
        esac
        exec redis-server --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - alphard-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphard-net

  pg-init:
    image: alpine:3.20
    container_name: alphard-pg-init
    restart: "no"
    security_opt:
      - apparmor=unconfined
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache postgresql-client bash >/dev/null
        # Wait for postgres to accept connections.
        until PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres \
              -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c 'SELECT 1' >/dev/null 2>&1; do
          echo "[pg-init] waiting for postgres..."
          sleep 3
        done
        # BUGFIX (issue #209): pg-init has been writing to hba_file locally
        # since PR #97, but `hba_file` from SHOW is a path *inside the postgres
        # container* — sed in this container can never touch it. The original
        # flow only worked when hba_file was a bind-mount from outside both
        # containers. Now that postgres uses a named volume (no bind), we can
        # only edit it via SQL — which is exactly what \\connect /etc/postgresql
        # can't do. So: detect whether the trust rule is already in effect via
        # pg_hba view, and short-circuit.
        TRUST_CIDR="${POSTGRES_TRUST_SUBNET:-172.16.0.0/12}"
        # Try to detect the trust rule by listing existing rules via pg_hba_file_rules().
        RULE_PRESENT=$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
                        -d "$$POSTGRES_DB" -tAc "SELECT count(*) FROM pg_hba_file_rules() \
                        WHERE type='host' AND database=array['all']::text[] AND \
                        user_name=array['all']::text[] AND address = '$${TRUST_CIDR}'")
        if [ "$${RULE_PRESENT:-0}" -gt 0 ]; then
          echo "[pg-init] trust line ($${TRUST_CIDR}) already in pg_hba_file_rules(), skipping"
        else
          HBA=$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
                 -d "$$POSTGRES_DB" -tAc "SHOW hba_file")
          if [ -z "$$HBA" ] || [ ! -e "$$HBA" ]; then
            echo "[pg-init] hba_file ($$HBA) not reachable from this container; trust rule MUST be set via SQL or via initdb init script"
            echo "[pg-init] OK (no-op — pre-existing postgres volume)"
            exit 0
          fi
          echo "[pg-init] injecting trust rule for $${TRUST_CIDR} into $$HBA"
          sed -i '/^host all all 192\.168\.0\.0\/16 trust$/d' "$$HBA" 2>/dev/null || true
          sed -i '/^host all all 0\.0\.0\.0\/0 trust$/d' "$$HBA" 2>/dev/null || true
          sed -i "1i host all all $${TRUST_CIDR} trust" "$$HBA"
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
            -d "$$POSTGRES_DB" -c 'SELECT pg_reload_conf()' >/dev/null
          echo "[pg-init] injected $${TRUST_CIDR} trust + pg_reload_conf()"
        fi
        echo "[pg-init] OK"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
      # Issue #97: narrow the pg_hba.conf trust range to the RFC1918
      # Docker bridge range by default. Operators can override via .env.
      POSTGRES_TRUST_SUBNET: ${POSTGRES_TRUST_SUBNET:-172.16.0.0/12}
    networks:
      - alphard-net
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: alphard-prometheus
    restart: unless-stopped
    # BUGFIX (2026-08-22 LXC): .107 Docker 29.1.x + PVE LXC bind-mount leaf
    # gets userns-mapped nobody:nogroup ownership; Prometheus writes its
    # WAL into /prometheus which becomes unwritable for the in-image 'nobody'
    # user. Same class of bug as #108 (alphard-bot /app/logs) and #122 (postgres
    # init.sql). Fix: replace bind-mount with tmpfs (root-owned, always writable).
    # Cost: TSDB lives in container memory; data is lost on container restart.
    # Acceptable for Phase 2 — restore bind-mount once we move observability to
    # a non-LXC Docker host (e.g. .110) or fix leaf ownership via a different
    # mechanism (PR #46-style perms_fix init container).
    #
    # Also: --web.enable-lifecycle so prometheus.yml can be hot-reloaded via
    # POST /-/reload after the inline startup script writes it on first boot.
    security_opt:
      - apparmor=unconfined
    # BUGFIX (2026-08-22 #149): PROM_YML_B64 must be declared explicitly
    # in service.environment because Portainer standalone does NOT
    # propagate stack-level Env vars into services that don't opt in.
    # Without this declaration the inline entrypoint decodes an empty
    # string and prometheus refuses to bind. The downstream
    # `environment:` block below (with the same key) is the actual
    # contract — this comment is here to anchor the rationale in
    # the file's first-pass reader.
    # Inline config write: write prometheus.yml on container startup from an
    # env-baked base64 blob, then exec prometheus. Avoids the bind-mount leaf
    # file-vs-directory quirk that .107 has for src=file mounts.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /etc/prometheus /prometheus
        echo "$$PROM_YML_B64" | base64 -d > /etc/prometheus/prometheus.yml
        # BUGFIX (issue #209): /prometheus is a named volume — Docker creates
        # it root-owned, but prom/prometheus runs as in-image `nobody` (uid 65534).
        # Without chown, queries.active write fails with EPERM and container
        # restart-loops. Same userns-mapping trap as bind-mounts, different fix.
        chown -R nobody:nobody /prometheus  # alpine uses nobody:nobody, not nogroup
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.listen-address=0.0.0.0:9090 \
          --web.enable-lifecycle
    environment:
      PROM_YML_B64: ${PROM_YML_B64:-}
    volumes:
      - alphard-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      alphard-net:
        aliases:
          - prometheus
          - alphard-prometheus
    profiles: ["observability"]
    healthcheck:
      # Prometheus exposes two lifecycle endpoints:
      #   GET /-/healthy  → 200 OK once the TSDB is open and web server
      #                     is serving traffic. Standard liveness probe.
      #   GET /-/ready    → 200 OK only after the initial WAL replay
      #                     completes; returns 503 while replaying.
      # /-/healthy is the right choice here — we want to know "is the
      # process alive and answering HTTP" not "is the query engine
      # fully caught up". wget is present in the prom/prometheus image
      # (used by the upstream Dockerfile for its own HEALTHCHECK).
      # start_period=60s covers the inline entrypoint which base64-decodes
      # prometheus.yml and writes /prometheus before exec'ing prometheus
      # (≈3s on cold TSDB rebuild), plus the initial WAL replay on
      # restart from the tmpfs-backed /prometheus.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # BUGFIX (2026-08-22): /mnt/appdata/.../grafana is a host-specific path that
  # breaks "first-shot install" portability — any operator must override it via
  # the Portainer Env stack config before StackUpdate succeeds, otherwise the
  # bind-mount source must exist on the host with the right ownership or
  # Grafana falls into the same .107 userns-mapped nobody loop we hit on
  # /app/logs (#108) and /prometheus (#147). The fix is a stack-level
  # APPDATA_DIR env (default /srv/alphard — the Linux-conventional path
  # outside /mnt) plus a one-shot grafana-init service that creates the
  # bind-mount leaf with the correct UID/GID 472:472 BEFORE grafana starts.
  # If the leaf already exists from a prior deploy, mkdir -p is a no-op;
  # chown only touches the leaf root so it doesn't recursively walk the
  # user's existing dashboard directory.
  grafana-init:
    image: alpine:3.20
    container_name: alphard-grafana-init
    restart: "no"
    security_opt:
      - apparmor=unconfined
    environment:
      APPDATA_DIR: ${APPDATA_DIR:-/srv/alphard}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        # Honour operator override for host data dir. ${APPDATA_DIR} on .107
        # is conventionally /mnt/appdata/alphard (matches the rest of the
        # selfhosted fleet: honcho, forgejo, immich, paperclip, bitmagnet,
        # minecraft, etc.). Default /srv/alphard works for any LXC/VM.
        mkdir -p "$$APPDATA_DIR/grafana"
        # BUGFIX (issue #216): sister-bug to PR #148. The /var/lib/grafana
        # bind was parameterised in #148, but provisioning/ and dashboards/
        # were still on relative ./docker/grafana/... bind-mounts. Portainer
        # standalone StackUpdate drops cwd → bind-mount leaves disappear
        # → /api/search returns []. Seed both leaves here so the bind
        # targets exist with the right ownership BEFORE grafana starts.
        mkdir -p "$$APPDATA_DIR/grafana/provisioning/dashboards" \
                 "$$APPDATA_DIR/grafana/provisioning/datasources" \
                 "$$APPDATA_DIR/grafana/dashboards"
        # UID/GID 472 = grafana user inside the grafana/grafana image;
        # only chown the leaf roots, not the contents (preserves any
        # dashboards / provisioning the operator provisioned by hand).
        # Recursive chown on the leaves is safe — they were just mkdir'd
        # empty by this very script on first-shot install; on subsequent
        # deploys the operator-owned content is preserved (already correct
        # UID:GID because grafana writes as 472).
        chown 472:472 "$$APPDATA_DIR/grafana" \
                      "$$APPDATA_DIR/grafana/provisioning" \
                      "$$APPDATA_DIR/grafana/provisioning/dashboards" \
                      "$$APPDATA_DIR/grafana/provisioning/datasources" \
                      "$$APPDATA_DIR/grafana/dashboards"
        echo "[grafana-init] OK: $$APPDATA_DIR/grafana owned by 472:472"
    volumes:
      - ${APPDATA_DIR_HOST:-/srv/alphard}:${APPDATA_DIR:-/srv/alphard}
    networks:
      - alphard-net

  grafana:
    image: grafana/grafana:latest
    container_name: alphard-grafana
    restart: unless-stopped
    # BUGFIX (2026-08-20): .107 Docker daemon has broken bridge port mapping
    # (iptables NAT empty after ContainerStart). Standard HostPort publishing
    # silently fails — host->container port is unreachable. Workaround: use
    # network_mode: host. Grafana shares the host network namespace, so its
    # 0.0.0.0:3000 listener = host's 0.0.0.0:3000. forgejo already lives on
    # host:3000, so Grafana binds to 3300 via GF_SERVER_HTTP_PORT instead.
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_HTTP_PORT: "3300"
    user: "472:472"
    volumes:
      - ${APPDATA_DIR:-/srv/alphard}/grafana:/var/lib/grafana
      # BUGFIX (issue #216): sister-bug to PR #148. The /var/lib/grafana
      # data dir was parameterised in #148, but provisioning/ and
      # dashboards/ were still on relative ./docker/grafana/... bind-mounts.
      # Portainer standalone StackUpdate drops cwd (REST render strips the
      # relative path prefix), so the bind-mounts resolved against the
      # wrong host directory → provisioning reads an empty directory
      # inside the container → /api/search?type=dash-db returns [].
      # Mirroring the /var/lib/grafana fix: parameterise via APPDATA_DIR
      # and seed the leaves from grafana-init so they exist with the
      # correct UID:GID (472:472) on first-shot install.
      - ${APPDATA_DIR:-/srv/alphard}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${APPDATA_DIR:-/srv/alphard}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - grafana-init
    healthcheck:
      # Grafana exposes GET /api/health → 200 OK with body `{"database":"ok"}`
      # once the server is bound and the internal DB is initialised. The
      # network_mode: host directive (BUGFIX 2026-08-20) means Grafana
      # listens on the host's loopback, NOT the compose bridge — so we
      # must hit the GF_SERVER_HTTP_PORT value (3300), NOT the upstream
      # default 3000 which would resolve to forgejo on .107. The task
      # brief specified 3000; this implementation overrides to 3300 to
      # match the actual bind. start_period=120s covers: grafana-init
      # mkdir + chown + Grafana's first-boot provisioning (datasource
      # load from /etc/grafana/provisioning, dashboard seeding from
      # /var/lib/grafana/dashboards, sqlite db creation). The 60s
      # window used for bot/prometheus is too tight for cold Grafana.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3300/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    profiles: ["observability"]

networks:
  alphard-net:
    driver: bridge

volumes:
  alphard-postgres-data:
    driver: local
  alphard-redis-data:
    driver: local
  alphard-prometheus-data:
    driver: local

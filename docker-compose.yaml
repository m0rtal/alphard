version: "3.9"

# =============================================================================
# Alphard Phase 1 — docker-compose.yaml
# =============================================================================
#
# Stack-level host paths are parameterised via APPDATA_DIR (default
# /srv/alphard; on .107 this is conventionally overridden to
# /mnt/appdata/alphard to match the rest of the selfhosted fleet: honcho,
# forgejo, immich, paperclip, bitmagnet, minecraft, etc.). A single
# one-shot `chownfix` service (compose refactor 2.0, kanban t_884fec4a)
# mkdir -p's and chown's all four host-data leaves (postgres, redis,
# grafana, prometheus) with the correct UID:GID for each in-image user
# before any data service starts. This replaces the per-service
# grafana-init / pg-init pattern from PR #217.
#
# chownfix needs `cap_add: [CHOWN, DAC_OVERRIDE]` to bypass the .107
# PVE LXC userns-mapping bug — root in-container cannot chown across
# the bind-mount leaf boundary without these caps, even with
# apparmor=unconfined. pg-init remains for hba_file rule injection
# (uses postgresql-client, separate concern).
#
# Why tmpfs for /app/logs and /prometheus (PR #119, #147)? Same root
# cause as the /mnt/appdata userns-mapping bug — Docker 29.1.x on PVE
# LXC maps bind-mount leaf to nobody:nogroup. tmpfs is the cheapest
# portable workaround. Data is volatile across container restarts,
# acceptable for logs (RotatingFileHandler) and the Prometheus TSDB
# (rebuild from bot on restart). Restore bind-mount paths once we
# move to a non-LXC host.
#
# Phase 1 components:
#   - alphard-bot        : heartbeat + cron-launched daily_sync.py
#   - postgres           : DataStore (ohlcv_daily, ticker_universe, decision_log)
#   - redis              : cache for risk state, news, portfolio drift
#   - pg-init            : injects Docker-bridge trust line into pg_hba.conf
#   - chownfix           : host-data leaf chown (compose refactor 2.0)
#
# Phase 3+ additions (profiles: ["observability"]):
#   - prometheus : scrape /metrics
#   - grafana    : dashboards (provisioning + dashboards baked from .env B64)
# =============================================================================
services:
  alphard-bot:
    image: ghcr.io/m0rtal/alphard:latest
    container_name: alphard-bot
    restart: unless-stopped
    # BUGFIX (#122): bot must run as root to read bind-mounted /root/.env
    user: root
    # BUGFIX (2026-08-21 LXC): docker-default AppArmor profile cannot load
    # in LXC unprivileged sandbox — bypass via unconfined for the whole
    # stack. Local-only override; .107 production is plain Docker and
    # tolerates extra cap (security_opt is per-container, not global).
    security_opt:
      - apparmor=unconfined
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # BUGFIX (#84): pass explicit ENV_FILE path so entrypoint.sh sources
      # the host's /root/.env even when the bind-mounted candidates
      # (/run/secrets/alphard.env, /run/secrets/alphard_env) resolve to
      # empty directories on .107 Docker 29.1.x. 11 chars — well under the
      # 60-char Portainer Env-parameter limit, so the long Tinkoff tokens
      # (64+ chars) still have to come from the file body.
      ENV_FILE: ${ENV_FILE:-/root/.env}
      ENV: ${ENV:-production}
      TINKOFF_SANDBOX_TOKEN: ${TINKOFF_SANDBOX_TOKEN:-}
      TINKOFF_REAL_TOKEN: ${TINKOFF_REAL_TOKEN:-}
      TINKOFF_ACCOUNT_ID: ${TINKOFF_ACCOUNT_ID:-}
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      RISK_MAX_DD_PCT: ${RISK_MAX_DD_PCT:-10}
      RISK_MAX_POSITION_PCT: ${RISK_MAX_POSITION_PCT:-5}
      RISK_MAX_SECTOR_PCT: ${RISK_MAX_SECTOR_PCT:-30}
      RISK_MAX_DAILY_LOSS_PCT: ${RISK_MAX_DAILY_LOSS_PCT:-3}
      RISK_ALLOW_SHORT: ${RISK_ALLOW_SHORT:-false}
      RISK_LEVERAGE_MAX: ${RISK_LEVERAGE_MAX:-1.0}
      DATA_DEFAULT_TIMEFRAME: ${DATA_DEFAULT_TIMEFRAME:-1d}
      DATA_HISTORY_YEARS: ${DATA_HISTORY_YEARS:-5}
      LIVE_TRADING: ${LIVE_TRADING:-false}
      # Phase 2.8 step 1: Prometheus metrics HTTP server port.
      # Defaults to 8765; exposed at alphard-bot:8765/metrics inside the network.
      ALPHARD_METRICS_PORT: ${ALPHARD_METRICS_PORT:-8765}
    volumes:
      # BUGFIX (alphard#108): bind-mount on .107 PVE LXC leaves the
      # leaf owned by userns-mapped nobody (uid 65534), which neither
      # the container's root user nor CAP_CHOWN can change. Alphard-bot
      # entrypoint.sh therefore cannot write /app/logs/backfill_*.log
      # and the whole stack restart-loops. Workaround: use a tmpfs
      # mount for /app/logs (root-owned, always writable). Cost: log
      # files live only inside the container, not on host filesystem,
      # so they are lost on container restart. Acceptable for Phase 0
      # — restore bind-mount once we move logs to a non-LXC Docker host
      # (e.g. .110, no userns mapping) or fix the bind-mount leaf
      # ownership via a different mechanism.
      #
      # Issue #120 (Defects 1, 2, 4) mitigates the tmpfs trade-off
      # (RotatingFileHandler in backfill_history_md.py, stderr banner
      # in entrypoint.sh, regression tests in test_compose_structure.py).
      # Defect 3 follow-up is tracked in issue #123.
      - type: tmpfs
        target: /app/logs
        tmpfs:
          size: 100M
      # BUGFIX (#122): bind-mount host /root/.env so entrypoint.sh can source ALPHARD_PG_DSN
      - /root/.env:/root/.env:ro
    networks:
      - alphard-net
    # BUGFIX (H-7): wait for postgres to be healthy before starting the bot,
    # otherwise the first store.count_ohlcv() crashes with connection refused.
    depends_on:
      - postgres
      - pg-init
      # chownfix (compose refactor 2.0): not strictly needed for the
      # bot itself (alphard-bot bind-mounts /root/.env, not APPDATA_DIR),
      # but adding it here synchronises the bot's start with the rest
      # of the stack so observability dashboards (which DO depend on
      # chownfix transitively) come up coherently. Without this the
      # bot can start before chownfix has chown'd the grafana leaf, and
      # a Watchtower-triggered recreate of grafana could race the bot's
      # first metrics scrape. Strictly optional ordering.
      - chownfix
    healthcheck:
      # Phase 2.8 metrics server (PR #52, #144) exposes GET /health on
      # ALPHARD_METRICS_PORT (default 8765) returning 200 with body "ok".
      # We hit 127.0.0.1:8765/health — the listener binds 0.0.0.0 inside
      # the container, so the loopback works without depending on the
      # alphard-net bridge. start_period=60s covers the slow first-boot
      # path: Postgres pg_hba.conf patch + main.py imports + MetricsServer
      # bind (typically 8–15s on this stack). retries=3 / interval=30s
      # gives a 90s grace window before the container is marked
      # unhealthy, which matches the existing postgres healthcheck
      # policy. Python3 is in the runtime image (src/main.py depends on
      # it), so no new deps.
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; r=urllib.request.urlopen(\"http://127.0.0.1:8765/health\", timeout=2); assert r.status==200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: alphard-postgres
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      # BUGFIX (H-8): fail-fast on missing password instead of starting
      # Postgres with an empty root password (which then allows empty auth).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
    volumes:
      - alphard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # BUGFIX (#126): inline shell healthcheck to avoid the .107
      # PVE LXC bind-mount leaf-directory quirk (Docker 29.1.x creates
      # ./docker/postgres/healthcheck.sh as a directory, not a file →
      # /bin/sh: Permission denied exit 126 → container permanently
      # unhealthy even though the script is correct).
      #
      # Two-stage probe:
      #   1. pg_isready with credentials — TCP+auth liveness
      #   2. psql SELECT 1 with PGPASSWORD — full auth round-trip,
      #      catches stale pg_authid scram hashes (prod bug 2026-08-18
      #      where pg_isready returned healthy but every real auth
      #      attempt failed)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h localhost -tAc 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # chownfix (compose refactor 2.0): wait for host-data leaf chown
    # before starting postgres. Currently postgres uses a named
    # volume (alphard-postgres-data, no bind-mount), so this is a
    # soft ordering — chownfix is essentially a no-op for the
    # postgres leaf. We add the dep so a future PR that switches
    # postgres to a bind-mount (e.g. for backup purposes) doesn't
    # have to also remember to update depends_on. Idempotent.
    depends_on:
      - chownfix
    networks:
      - alphard-net

  redis:
    image: redis:7-alpine
    container_name: alphard-redis
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # BUGFIX (2026-08-22 #149): Portainer standalone does NOT propagate
    # stack-level Env vars into service-level environment unless the
    # service explicitly declares them. Without this explicit declaration
    # the redis container's entrypoint sees REDIS_PASSWORD as unset,
    # the inline fail-fast gate trips, and the container restart-loops
    # forever (verified on .107 stack #111 after StackUpdate from main
    # HEAD 95c7095 — alphard-redis exited every 1s with "REDIS_PASSWORD
    # is required (unset/empty in env)").
    #
    # The same applies to POSTGRES_PASSWORD on postgres and every other
    # service that consumes stack-level secrets. Listing them here does
    # NOT change compose CLI behaviour — `${VAR:-}` defaults still apply
    # if the operator omits the Env from Portainer stack config — it
    # just stops Portainer from stripping them from the rendered
    # container env. Keep this list in sync with the stack Env config
    # (see /data/compose/111/stack.env on .107 for the canonical list).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # BUGFIX (H-8): fail-fast on missing redis password.
    #
    # Why not `${REDIS_PASSWORD:?...}`: YAML anchor (Portainer StackUpdate
    # `?` semantics) makes the literal form `?` blow up Compose parsing
    # under Portainer standalone (issue #122 regression). We instead
    # wrap the redis command in an inline shell script that exits
    # non-zero if REDIS_PASSWORD is unset/empty. `$$` is escaped so
    # Compose renders it as a literal `$` for the container shell.
    # With REDIS_PASSWORD="" the container exits within ~1s of
    # `docker compose up` → restart loop visible in `docker ps`.
    command:
      - sh
      - -c
      - |
        # Issue #129: harden the fail-fast gate against shell-metacharacter
        # passwords. PR #128 only checked for empty REDIS_PASSWORD, but the
        # command runs under `sh -c`, so a non-empty password containing
        # `$`, `"`, `\`, or backtick would be silently mangled before
        # `redis-server --requirepass` saw it. In the worst case the
        # mangling produces an empty `--requirepass` arg and Redis starts
        # without authentication (any container on the alphard-net bridge
        # can then read/write Redis). In the more common case Redis fails
        # to start with "wrong number of arguments" and the container
        # restart-loops until the operator notices.
        if [ -z "$${REDIS_PASSWORD:-}" ]; then
          echo "[alphard-redis] FATAL: REDIS_PASSWORD is required (unset/empty in env)" >&2
          echo "[alphard-redis] FATAL: set REDIS_PASSWORD in .env before 'docker compose up'" >&2
          exit 1
        fi
        # Reject any shell metacharacter in the password. We use printf
        # to inject literal `$` and `"` into the case pattern because
        # POSIX case-pattern matching has no portable way to escape them
        # inside a literal-string pattern; backslash and backtick can be
        # written as literal `'\'` and `` '`' ``. The heredoc preserves
        # the backslashes verbatim. See issue #129.
        case "$${REDIS_PASSWORD}" in
          *$(printf '%s' '$')*|*$(printf '%s' '"')*|*'\'*|*'`'*)
            echo "[alphard-redis] FATAL: REDIS_PASSWORD contains shell-unsafe characters (\$, \", \\, or backtick)" >&2
            echo "[alphard-redis] FATAL: regenerate with: openssl rand -base64 24" >&2
            echo "[alphard-redis] FATAL: the inline sh -c wrapper would mangle --requirepass before redis-server could read it" >&2
            exit 1
            ;;
        esac
        exec redis-server --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - alphard-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # chownfix (compose refactor 2.0): soft ordering — same rationale
    # as postgres above. Current redis uses a named volume
    # (alphard-redis-data, no bind-mount) so chownfix is no-op;
    # the dep keeps the contract future-proof.
    depends_on:
      - chownfix
    networks:
      - alphard-net

  pg-init:
    # BUGFIX (2026-08-26): switched image from alpine:3.20 to
    # postgres:16-alpine. The alpine image's `apk add` was failing on
    # hosts with restricted egress (`.107` PVE LXC, sandboxed CI runners)
    # because `dl-cdn.alpinelinux.org` was unreachable. `postgres:16-alpine`
    # ships with the matching `psql` client pre-installed — no `apk add`
    # step required. The cmd still uses `sh -c` (busybox), not bash.
    image: postgres:16-alpine
    container_name: alphard-pg-init
    restart: "no"
    security_opt:
      - apparmor=unconfined
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Wait for postgres to accept connections.
        until PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres \
              -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c 'SELECT 1' >/dev/null 2>&1; do
          echo "[pg-init] waiting for postgres..."
          sleep 3
        done
        # BUGFIX (issue #209): pg-init has been writing to hba_file locally
        # since PR #97, but `hba_file` from SHOW is a path *inside the postgres
        # container* — sed in this container can never touch it. The original
        # flow only worked when hba_file was a bind-mount from outside both
        # containers. Now that postgres uses a named volume (no bind), we can
        # only edit it via SQL — which is exactly what \\connect /etc/postgresql
        # can't do. So: detect whether the trust rule is already in effect via
        # pg_hba view, and short-circuit.
        TRUST_CIDR="${POSTGRES_TRUST_SUBNET:-172.16.0.0/12}"
        # Try to detect the trust rule by listing existing rules via pg_hba_file_rules().
        RULE_PRESENT=$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
                        -d "$$POSTGRES_DB" -tAc "SELECT count(*) FROM pg_hba_file_rules() \
                        WHERE type='host' AND database=array['all']::text[] AND \
                        user_name=array['all']::text[] AND address = '$${TRUST_CIDR}'")
        if [ "$${RULE_PRESENT:-0}" -gt 0 ]; then
          echo "[pg-init] trust line ($${TRUST_CIDR}) already in pg_hba_file_rules(), skipping"
          HBA_REACHABLE=1
        else
          HBA=$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
                 -d "$$POSTGRES_DB" -tAc "SHOW hba_file")
          if [ -z "$$HBA" ] || [ ! -e "$$HBA" ]; then
            echo "[pg-init] hba_file ($$HBA) not reachable from this container; trust rule MUST be set via SQL or via initdb init script"
            HBA_REACHABLE=0
          else
            HBA_REACHABLE=1
            echo "[pg-init] injecting trust rule for $${TRUST_CIDR} into $$HBA"
            sed -i '/^host all all 192\.168\.0\.0\/16 trust$/d' "$$HBA" 2>/dev/null || true
            sed -i '/^host all all 0\.0\.0\.0\/0 trust$/d' "$$HBA" 2>/dev/null || true
            sed -i "1i host all all $${TRUST_CIDR} trust" "$$HBA"
            PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
              -d "$$POSTGRES_DB" -c 'SELECT pg_reload_conf()' >/dev/null
            echo "[pg-init] injected $${TRUST_CIDR} trust + pg_reload_conf()"
          fi
        fi
        # BUGFIX (issue #243 A1, first-shot-friendly): on pre-existing
        # postgres volumes, initdb never ran docker-entrypoint-initdb.d/
        # scripts so tables may be missing entirely. We can't depend on
        # initdb; instead we replay the idempotent init.sql + schema.sql
        # every time pg-init starts. Both files use CREATE TABLE IF NOT
        # EXISTS / CREATE INDEX IF NOT EXISTS / ON CONFLICT DO NOTHING,
        # so this is safe to run on every deploy.
        # - docker/postgres/init.sql creates the _auth_probe table.
        # - src/data/schema.sql creates the runtime schema (trades,
        #   decision_log, ticker_universe, _auth_probe, plus indexes).
        # The bot's own init_schema() at startup is the authoritative
        # source of truth, but pg-init covers the case where the bot
        # has never run (no _auth_probe table to probe against).
        echo "[pg-init] applying docker/postgres/init.sql (idempotent replay)"
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
          -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 \
          -f /sql/docker_postgres_init.sql 2>&1 | sed 's/^/  /' || {
            echo "[pg-init] init.sql apply failed (likely already applied on a normal initdb path; continuing)"
        }
        echo "[pg-init] applying src/data/schema.sql (idempotent replay)"
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h alphard-postgres -U "$$POSTGRES_USER" \
          -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 \
          -f /sql/src_data_schema.sql 2>&1 | sed 's/^/  /' || {
            echo "[pg-init] schema.sql apply failed (likely already applied by bot init_schema(); continuing)"
        }
        echo "[pg-init] OK"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
      # Issue #97: narrow the pg_hba.conf trust range to the RFC1918
      # Docker bridge range by default. Operators can override via .env.
      POSTGRES_TRUST_SUBNET: ${POSTGRES_TRUST_SUBNET:-172.16.0.0/12}
    # BUGFIX (issue #243 A1): bind-mount the idempotent SQL sources so
    # pg-init can replay them on every deploy against pre-existing
    # volumes where docker-entrypoint-initdb.d/ never ran. See
    # https://github.com/m0rtal/alphard/issues/245 — closes A1.
    volumes:
      - ./docker/postgres/init.sql:/sql/docker_postgres_init.sql:ro
      - ./src/data/schema.sql:/sql/src_data_schema.sql:ro
    networks:
      - alphard-net
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: alphard-prometheus
    restart: unless-stopped
    # BUGFIX (2026-08-22 LXC): .107 Docker 29.1.x + PVE LXC bind-mount leaf
    # gets userns-mapped nobody:nogroup ownership; Prometheus writes its
    # WAL into /prometheus which becomes unwritable for the in-image 'nobody'
    # user. Same class of bug as #108 (alphard-bot /app/logs) and #122 (postgres
    # init.sql). Fix: replace bind-mount with tmpfs (root-owned, always writable).
    # Cost: TSDB lives in container memory; data is lost on container restart.
    # Acceptable for Phase 2 — restore bind-mount once we move observability to
    # a non-LXC Docker host (e.g. .110) or fix leaf ownership via a different
    # mechanism (PR #46-style perms_fix init container).
    #
    # Also: --web.enable-lifecycle so prometheus.yml can be hot-reloaded via
    # POST /-/reload after the inline startup script writes it on first boot.
    security_opt:
      - apparmor=unconfined
    # BUGFIX (2026-08-22 #149): PROM_YML_B64 must be declared explicitly
    # in service.environment because Portainer standalone does NOT
    # propagate stack-level Env vars into services that don't opt in.
    # Without this declaration the inline entrypoint decodes an empty
    # string and prometheus refuses to bind. The downstream
    # `environment:` block below (with the same key) is the actual
    # contract — this comment is here to anchor the rationale in
    # the file's first-pass reader.
    # Inline config write: write prometheus.yml on container startup from an
    # env-baked base64 blob, then exec prometheus. Avoids the bind-mount leaf
    # file-vs-directory quirk that .107 has for src=file mounts.
    # BUGFIX (issue #283): PROM_YML_B64 used to be the source of truth
    # for the scrape config. Portainer StackUpdate silently truncates env
    # values >60 chars (Go JSON unmarshal fails on long strings) and
    # 292-byte base64 blobs were routinely cut off mid-keyword. Now we
    # bind-mount the config file from the repo (./docker/prometheus/prometheus.yml)
    # instead — the 60-char limit no longer applies and a config change
    # is a normal git diff.
    #
    # BUGFIX (issue #209): prom/prometheus runs as in-image nobody (uid 65534)
    # but /prometheus is a Docker-managed named volume owned by root:root.
    # Without chown, queries.active write fails with EPERM and the container
    # restart-loops. We chown here in the entrypoint BEFORE exec. The
    # config file itself (bind-mounted :ro) is not affected — userns-mapping
    # trap only applies to writable leaves.
    #
    # --web.enable-lifecycle stays so prometheus.yml can be hot-reloaded via
    # POST /-/reload after the config file is updated on the host.
    entrypoint:
      - sh
      - -c
      - |
        chown -R nobody:nobody /prometheus
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.listen-address=0.0.0.0:9090 \
          --web.enable-lifecycle
    volumes:
      # Read-only config mount from the bind-mounted repo leaf. The leaf
      # file (docker/prometheus/prometheus.yml) has been the source of
      # truth for the scrape config since Phase 2.8 step 1 — quickstart.sh
      # used to base64-bake it into PROM_YML_B64 before issue #283 made
      # that path unreliable due to Portainer's 60-char env limit.
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # TSDB lives in a named volume so /prometheus is root-owned by Docker
      # itself, not bind-mounted (avoiding the #108 / #122 leaf trap).
      - alphard-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    # chownfix (compose refactor 2.0): soft ordering — prom uses a
    # named volume (alphard-prometheus-data), so chownfix is a no-op
    # for /prometheus on the host side. Kept here for symmetry with
    # postgres/redis/grafana so all four data services share the same
    # chownfix contract.
    depends_on:
      - chownfix
    networks:
      alphard-net:
        aliases:
          - prometheus
          - alphard-prometheus
    profiles: ["observability"]
    healthcheck:
      # Prometheus exposes two lifecycle endpoints:
      #   GET /-/healthy  → 200 OK once the TSDB is open and web server
      #                     is serving traffic. Standard liveness probe.
      #   GET /-/ready    → 200 OK only after the initial WAL replay
      #                     completes; returns 503 while replaying.
      # /-/healthy is the right choice here — we want to know "is the
      # process alive and answering HTTP" not "is the query engine
      # fully caught up". wget is present in the prom/prometheus image
      # (used by the upstream Dockerfile for its own HEALTHCHECK).
      # start_period=60s covers the inline entrypoint which base64-decodes
      # prometheus.yml and writes /prometheus before exec'ing prometheus
      # (≈3s on cold TSDB rebuild), plus the initial WAL replay on
      # restart from the tmpfs-backed /prometheus.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # CHOWNFIX (compose refactor 2.0, kanban t_884fec4a): one-shot init
  # service that pre-creates all host-bind-mount leaves with the correct
  # uid:gid ownership BEFORE any data service starts. Replaces the
  # per-service grafana-init (PR #217) with a single chownfix that
  # covers all four leaves (postgres, redis, grafana, prometheus).
  #
  # Why one service instead of four (grafana-init, pg-init + future
  # redis-init/prometheus-init):
  # 1. ONE apk add (no postgresql-client binary, since we use plain
  #    chown here — pg-init used psql to inject hba_file rules, but
  #    that path is no longer needed: PR #147 + #209 moved hba_file
  #    handling into the postgres initdb / pg_hba_file_rules() view).
  # 2. ONE chown pass per leaf instead of one container per leaf —
  #    faster cold start, less log noise.
  # 3. Single point of truth for the chown UID:GID mapping table;
  #    a future leaf add (e.g. alertmanager) is one chown line.
  #
  # CAP_CHOWN + DAC_OVERRIDE are REQUIRED to bypass the .107 PVE LXC
  # userns-mapping bug (issue #108 / #122 / #147 / #209 / #216).
  # Without these caps the in-container root user still cannot
  # chown across the bind-mount leaf boundary, even with
  # `apparmor=unconfined` — verified live 2026-08-22 on .107 stack
  # 112 with the previous grafana-init (which only had root + no
  # cap_add). On hosts where the bug does not apply (plain Docker
  # on a non-LXC VM), the caps are harmless — Docker drops them
  # back to the default set when the container starts.
  #
  # WATCHTOWER LABEL: `com.centurylinklabs.watchtower.enable=false`.
  # This is the canonical watchtower opt-out label (verified via
  # containrrr docs and the project's own README pattern). Without
  # it, watchtower would delete this one-shot container on its
  # next tick (no upstream image to pull → chownfix has no
  # permanent "running" state, so watchtower interprets it as
  # needing removal). With the label, watchtower ignores it and
  # the next StackUpdate re-creates it idempotently.
  chownfix:
    image: alpine:3.20
    container_name: alphard-chownfix
    restart: "no"
    security_opt:
      - apparmor=unconfined
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      APPDATA_DIR: ${APPDATA_DIR:-/srv/alphard}
    volumes:
      - ${APPDATA_DIR:-/srv/alphard}:${APPDATA_DIR:-/srv/alphard}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        APPDATA_DIR="$${APPDATA_DIR:-/srv/alphard}"
        echo "[chownfix] APPDATA_DIR=$$APPDATA_DIR"
        # UID:GID mapping (verified against the in-image entrypoint users):
        #   postgres 999:999     postgres:16-alpine entrypoint
        #   redis    999:999     redis:7-alpine (same numeric UID)
        #   grafana  472:472     grafana/grafana in-image 'grafana'
        #   prom     65534:65534 prom/prometheus runs as in-image 'nobody'
        mkdir -p "$$APPDATA_DIR/postgres" \
                 "$$APPDATA_DIR/redis" \
                 "$$APPDATA_DIR/grafana" \
                 "$$APPDATA_DIR/prometheus"
        chown -R 999:999     "$$APPDATA_DIR/postgres"
        chown -R 999:999     "$$APPDATA_DIR/redis"
        chown -R 472:472     "$$APPDATA_DIR/grafana"
        chown -R 65534:65534 "$$APPDATA_DIR/prometheus"
        echo "[chownfix] OK: 4 leaves chowned"
    networks:
      - alphard-net

  # GRAFANA — compose refactor 2.0 (kanban t_884fec4a)
  #
  # This is the FINAL fix for the LXC bind-mount saga that started with
  # issue #108 (alphard-bot /app/logs, PR #119) and issue #147
  # (prometheus, PR #147 → #209) and #216 (grafana provisioning,
  # PR #217). PR #217 fixed grafana provisioning via APPDATA_DIR bind-
  # mount, but that approach still requires the operator's host path
  # to match exactly the bind source AND for the chown to actually
  # take effect at the bind-mount boundary — fragile.
  #
  # THIS refactor removes ALL bind-mounts to docker/grafana/* config
  # directories. The provisioning YAMLs and dashboard JSONs are baked
  # into base64 env vars (PROVISIONING_DATASOURCES_YML_B64,
  # PROVISIONING_DASHBOARDS_PROVIDER_YML_B64, DASHBOARD_PHASE0_JSON_B64,
  # DASHBOARD_PHASE28_JSON_B64) and decoded at container start by
  # docker/entrypoint_grafana.sh into the upstream-default paths
  # /etc/grafana/provisioning and /var/lib/grafana/dashboards. These
  # paths are inside the container's writable filesystem — no bind-
  # mount boundary, no userns-mapping, no host-path dependency.
  #
  # The ONLY bind-mount remaining for grafana is /var/lib/grafana (the
  # sqlite db + plugin store), which still benefits from a named
  # volume path so the chownfix service can pre-create it with 472:472.
  # Prom has the same named-volume pattern (PR #209).
  #
  # declared env vars (Portainer standalone contract — see issue #149):
  # every *_B64 must appear in service.environment even though it's
  # also set at stack level; Portainer standalone strips undeclared
  # stack-level vars during render, which would leave the entrypoint
  # with empty values and exit 1 loudly. The empty default
  # (`${X:-}`) means a misconfigured stack fails loudly, not silently
  # with a half-loaded provisioning.
  grafana:
    image: grafana/grafana:latest
    container_name: alphard-grafana
    restart: unless-stopped
    # BUGFIX (2026-08-20): .107 Docker daemon has broken bridge port mapping
    # (iptables NAT empty after ContainerStart). Standard HostPort publishing
    # silently fails — host->container port is unreachable. Workaround: use
    # network_mode: host. Grafana shares the host network namespace, so its
    # 0.0.0.0:3000 listener = host's 0.0.0.0:3000. forgejo already lives on
    # host:3000, so Grafana binds to 3300 via GF_SERVER_HTTP_PORT instead.
    network_mode: host
    security_opt:
      - apparmor=unconfined
    # Bind-mount provisioning + dashboards directly from the repo. This
    # replaces the previous env-based approach (PR #246, issue #297) which
    # relied on PROVISIONING_*_B64 env vars decoded by an in-container
    # entrypoint wrapper (docker/entrypoint_grafana.sh). That approach
    # hit the same Portainer 60-char env truncation bug as PROM_YML_B64
    # (issue #283 / PR #284): after StackUpdate on .107 the *_B64 values
    # were truncated to ~80 chars, base64 -d produced garbage or empty
    # bytes, and Grafana started with no datasource and no dashboards
    # ("No data" on every panel even though prometheus was scraping
    # alphard-bot correctly).
    #
    # Trade-off: dashboards are now read-only (:ro), so Grafana's UI
    # "save dashboard" button will fail with a permission error. This is
    # intentional — dashboards are git-versioned (same model as
    # docker/prometheus/prometheus.yml from PR #284). To edit a dashboard
    # locally, modify the JSON in docker/grafana/dashboards/, commit,
    # push, then Portainer StackUpdate on .107.
    #
    # Why no chownfix needed: bind-mounts from the repo retain their
    # on-disk permissions (root:root 0644 in this case). The upstream
    # Grafana image's /run.sh entrypoint tolerates this because it runs
    # initial setup as root before dropping to uid 472 via gosu. Same
    # reasoning as PR #284 for prometheus.yml.
    volumes:
      - ${APPDATA_DIR:-/srv/alphard}/grafana:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_HTTP_PORT: "3300"
    # Watchtower label — grafana is a long-running service we DO want
    # auto-updated on image push. Sister-label to chownfix's opt-out.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - prometheus
      - chownfix
    healthcheck:
      # Grafana exposes GET /api/health → 200 OK with body `{"database":"ok"}`
      # once the server is bound and the internal DB is initialised. The
      # network_mode: host directive (BUGFIX 2026-08-20) means Grafana
      # listens on the host's loopback, NOT the compose bridge — so we
      # must hit the GF_SERVER_HTTP_PORT value (3300), NOT the upstream
      # default 3000 which would resolve to forgejo on .107. start_period
      # is 120s on the FIRST deploy (cold Grafana: decode 4 b64 files +
      # sqlite db create + datasource load + dashboard load) and 60s on
      # subsequent restarts (sqlite db already exists). We use the
      # upper bound so a Watchtower recreate right after a StackUpdate
      # doesn't get marked unhealthy while the b64 decode is still
      # running (decode of 4 files ≈ 50ms but disk write + chown +
      # grafana first-boot provisioning can spike to 90s on a slow LXC).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3300/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    profiles: ["observability"]

networks:
  alphard-net:
    driver: bridge

volumes:
  alphard-postgres-data:
    driver: local
  alphard-redis-data:
    driver: local
  alphard-prometheus-data:
    driver: local

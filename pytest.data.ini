# pytest config for Phase 1.1 (Data Agent)
#
# This config is used to gate the Data Agent subpackage independently of
# the global CI run. The global pyproject.toml sets source=src so that
# ``pytest`` without arguments checks the whole codebase at 95%. For the
# Data Agent we need:
#
#   pytest tests/test_data_loader.py \
#         --cov-config=pytest.data.ini \
#         --cov=src.data \
#         --cov-fail-under=75
#
# Why a separate ini
# ------------------
# pytest-cov applies the ``[tool.coverage.run] source`` from pyproject.toml
# by default. We override via ``--cov-config`` here. ``source=src.data``
# limits measurement to the data package; ``omit`` excludes pg_store (no
# psycopg in CI) and the ``src/risk/`` + ``src/main.py`` siblings.

[run]
source = src.data
omit =
    src/data/pg_store.py
    src/data/quality/*
    src/main.py
    src/risk/*
    src/__init__.py

[report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    \.\.\.
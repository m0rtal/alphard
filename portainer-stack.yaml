version: "3.9"

# Alphard stack — Portainer deployment variant.
# Все секреты обязательны (${VAR} refs, Portainer подставит из Env payload).
# См. docs/SECURITY.md P0 #6: пароли > 16 chars обязательны.
# См. README.md "Quickstart": перед deploy задай Env vars в Portainer UI или через API payload.
#
# ВАЖНО: этот файл синхронизирован с docker-compose.yaml (D-H3).
# - image alphard-bot = alphard:latest (тот же image, что собирает локальный
#   docker compose build; не запускаем python:3.11-slim с inline-установкой
#   pytest в прод).
# - env vars и volumes совпадают с docker-compose.yaml.
# - Volume alphard-logs используется как named (на .107 нет ./logs bind-mount).
# - Memory/CPU лимиты = те же 2G / 1.0 cpu.
# Перед любым изменением — сверяйся с docker-compose.yaml.

services:
  alphard-bot:
    image: alphard:latest
    container_name: alphard-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: ${ENV:-production}
      TINKOFF_SANDBOX_TOKEN: ${TINKOFF_SANDBOX_TOKEN:?TINKOFF_SANDBOX_TOKEN required}
      TINKOFF_REAL_TOKEN: ${TINKOFF_REAL_TOKEN:-}
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      RISK_MAX_DD_PCT: ${RISK_MAX_DD_PCT:-10}
      RISK_MAX_POSITION_PCT: ${RISK_MAX_POSITION_PCT:-5}
      RISK_MAX_SECTOR_PCT: ${RISK_MAX_SECTOR_PCT:-30}
      RISK_MAX_DAILY_LOSS_PCT: ${RISK_MAX_DAILY_LOSS_PCT:-3}
      RISK_ALLOW_SHORT: ${RISK_ALLOW_SHORT:-false}
      RISK_LEVERAGE_MAX: ${RISK_LEVERAGE_MAX:-1.0}
      DATA_DEFAULT_TIMEFRAME: ${DATA_DEFAULT_TIMEFRAME:-1d}
      DATA_HISTORY_YEARS: ${DATA_HISTORY_YEARS:-5}
    volumes:
      - alphard-logs:/app/logs
    networks:
      - alphard-net
    # Phase 0: healthcheck отключён (entrypoint — stub, не поднимает HTTP)
    # TODO Phase 1: реальный health endpoint через FastAPI
    # SECURITY: работает под non-root user alphard (UID 1000) из Dockerfile.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  postgres:
    image: postgres:16-alpine
    container_name: alphard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-alphard}
    volumes:
      - alphard-postgres-data:/var/lib/postgresql/data
    # ports: NO — postgres ТОЛЬКО внутри alphard-net (SECURITY.md P0 #8)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphard-net

  redis:
    image: redis:7-alpine
    container_name: alphard-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - alphard-redis-data:/data
    # Healthcheck uses ping without password to avoid leaking REDIS_PASSWORD
    # into /proc/1/cmdline (PIDC1 read by host processes leaks credential).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphard-net

  # Observability — опциональный профиль (Phase 3+)
  # Включается через Portainer: stack edit → Profiles → observability.
  # Skeleton-конфиги в docker/prometheus/ и docker/grafana/dashboards/.
  prometheus:
    image: prom/prometheus:latest
    container_name: alphard-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - alphard-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - alphard-net
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    container_name: alphard-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
    volumes:
      - alphard-grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - alphard-net
    profiles: ["observability"]

volumes:
  alphard-logs:
  alphard-postgres-data:
  alphard-redis-data:
  alphard-prometheus-data:
  alphard-grafana-data:

networks:
  alphard-net:
    driver: bridge

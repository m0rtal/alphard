# Custom gitleaks rules for alphard (Phase 1.6 audit 2026-08-18).
#
# Why: default gitleaks misses high-entropy random strings that look like
# passwords but lack a known vendor prefix (sk-, ghp_, AKIA, etc.). Our
# previous "test password" `kJ8sP2vR5mN9wX4tY7qL3zA6bC1dE0fH` shipped to
# production because it wasn't caught by either default gitleaks OR our
# own review.
#
# Rules below catch the most common leak paths in a Docker + Postgres +
# Russian-market stack. False positives are acceptable: a leak in CI is
# much costlier than a 30-second manual review per commit.

title = "alphard-gitleaks-custom"

[[rules]]
id = "alphard-hardcoded-password-assignment"
description = "Inline password= / POSTGRES_PASSWORD: <value> in committed files"
# Negative lookahead: skip values that are env-var refs (${VAR} or $VAR)
# or explicit placeholder tokens (TODO, FIXME, ci_test_password_*). The
# allowlist below also adds an explicit env-var reference regex.
regex = '''(?i)(?:password|passwd|pass|pwd|secret|api[_-]?key|token)\s*[=:]\s*['"]?(?!\$|\{|ci_test_password_|ci_test_password|CHANGE_ME|TODO|REPLACE|FIXME|XXX|YOUR_|EXAMPLE_|SAMPLE_|dummy|test_only)[A-Za-z0-9+/=._-]{6,}'''
keywords = ["password", "passwd", "secret", "api_key", "apikey", "token"]

[allowlist]
description = "Allow CI fixture marker and env-var references"
regexes = [
  '''ci_test_password_DO_NOT_USE_IN_PRODUCTION''',
  '''\$\{?[A-Z_][A-Z0-9_]*\}?''',
]
paths = []
stopwords = []
